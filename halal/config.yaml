# Halal policy settings. Units: m, rad, s. Organiser baseline values are changed only through `baseline_overrides`.
baseline_overrides: {}        # dotted keys on top of aaltonomous/baselines/classical/config.yaml (profile `sim`)

perception:
  detector: topface           # key of halal.perception.DETECTORS
  calibration:                # self-calibration of the head camera per episode (halal.perception.calibration)
    max_turn_deg: 3.0         # a larger correction than this (per stage) is not believed: nominal pose kept
    max_shift: 0.03
    plane:                    # counter plane in front of the bins -> roll, pitch, height
      pixel_step: 4
      x_range: [0.16, 0.38]
      y_half: 0.42
      search: 0.03            # points this close to the nominal counter height enter the fit
      tolerances: [0.010, 0.004, 0.003]   # inlier bands of the successive refits
      min_points: 1500
      max_rms: 0.004
    wall:                     # front faces of the bin row -> yaw, x (line) and y (segment ends)
      pixel_step: 2
      height_band: [0.010, 0.040]   # above the counter: clear of bin floors, object tops and rims
      search: 0.035
      y_half: 0.42
      tolerances: [0.010, 0.004, 0.003]
      min_points: 600
      max_rms: 0.004
      profile_step: 0.001
      profile_heights: [0.015, 0.025, 0.035]
      depth_tolerance: 0.006
      min_profile: 150        # observed millimetres of wall line (wall or gap) needed for the y fit
      min_agreement: 0.8      # fraction of the observed profile the best shift must explain
  topface:                    # halal.perception.detectors.topface
    depth_median: 3           # median filter on the depth image before anything else, px
    bin_margin: 0.008         # points this close to a bin footprint are not objects on the counter
    min_separation: 0.03      # two fits closer than this are one object
    min_support_px: 40        # object pixels needed to name a colour
    min_confidence: 0.05      # detections below this are dropped
    min_shape_margin: 0.06    # lead (outline-area fraction) of the best shape, below it shape is None
    min_yaw_contrast: 0.08    # score the worst yaw loses (outline-area fraction), below it yaw is None
    score_range: [0.0, 0.2]   # outline fit score (fraction of the outline seen minus contradicted) mapped to confidence 0..1
    seed:
      height_band: 0.006      # top-face pixels: this close to the object height above the counter
      open_px: 3
      min_px: 60
    outline:
      cell: 0.001             # top-plane grid pitch
      view_cells: 112         # evidence grid side (even)
      outline_cells: 70       # outline mask side (even): covers the cube diagonal
      depth_tolerance: 0.004  # along the ray: nearer than this to the top plane counts as top face
      coarse_yaw_deg: 6       # yaw step of the half-resolution search, refined to 1 deg
      refine_cells: 3
      support_coverage: 0.99  # outline mask value above which a seen top-face cell counts as support
    color:
      window_px: 80           # half side of the image window searched for an object's pixels
      body_radius: 0.030      # object pixels: this close to the fitted centre in xy ...
      body_heights: [0.008, 0.050]   # ... and between these heights above the counter (top and side faces)
      vivid_fraction: 0.3     # most saturated share of the object's pixels that names its colour (overexposed tops lie)
      hue_sure_deg: 15        # a hue this close to its reference is fully trusted; confidence falls to 0 at the class boundary
      chroma_range: [0.15, 0.30]   # (max - min) / max of the white-balanced colour mapped to confidence 0..1
      mat_band: 0.004         # mat pixels: this close to the counter plane
      mat_x_range: [0.18, 0.38]
  bench:                      # halal.eval.perception_bench
    match_radius: 0.03        # a detection belongs to the nearest ground-truth top centre within this xy distance
    heldout_every: 4          # seeds with seed % n == n - 1 are held out: never tuned on
    resting_tolerance: 0.015  # object centre this close to its resting height counts as lying on the counter
    min_inside: 0.9           # top-face fraction inside the image, below it the view is `border`
    occlusion_gap: 0.015      # depth this much nearer than the top face means something is in front of it
    max_blocked: 0.1          # top-face fraction that may be covered before the view is `hidden`
    sim_principal_point: [319.5, 239.5]   # the Isaac renderer ignores calibration.yaml's cx, cy (fitted on dr_train)
    camera_edges_mm: [5, 10, 15]
    gain_edges: [0.97, 1.03]
    key_light_edges: [0.87, 1.13]
    hue_edges_deg: [3.5]

motion:
  finger_yaw_weight: 3.0      # IK weight of a grasp's finger heading (the organiser default hint weight is 0.3)
  finger_yaw_tolerance: 0.21  # rad between requested and achieved finger heading before a grasp is rejected
  natural_heading_deg: 25     # finger heading an arm reaches most easily: forward, turned inward by this much
  max_heading_deviation_deg: 75   # headings further than this from the natural one are not tried
  counter_from_detection: true    # counter height = detected object top minus object height (scene file value otherwise)
  bin_margin: 0.0             # hand points this close to a bin footprint must clear its rim (organiser planner: 0.01)
  shortcut_tolerance:         # a Cartesian segment becomes one joint move if the grasp point strays less than this
    default: 0.01
    descend: 0.004
    lift: 0.004
  candidates:                 # strategy names per detected shape, best first; `unknown` = shape not classified
    cube: [pinch_face, pinch]
    cylinder: [pinch]
    triangle: [pinch]
    unknown: [pinch]
  # Per strategy: headings_deg (finger heading minus object yaw, per shape), point_in_palm, preshape / closed /
  # release (LEFT order), height_frac, shift_along_fingers. Unset keys keep the organiser pinch.
  grasps:
    pinch: {}
    pinch_face:
      headings_deg: {cube: [0, 90, 180, 270]}

grasp_bench:
  settle_ticks: 20            # hold after placing the objects before reading their poses
  trace_every: 2              # ticks between privileged object pose samples
  held_radius: 0.08           # object counts as in the hand within this distance of the grasp point
  lifted_height: 0.03         # and at least this far above its resting height
  hard_dr: {friction_max: 0.82, mass_min: 1.2}   # `dr: hard` keeps seeds giving every placed object such scales

policy:
  look_pose: home             # arm pose the head image is taken from, where picks start and end: `home` or a key of `poses`
  counter_edge_margin: 0.02   # a detection this close to the counter's edge, or beyond it, is not picked
  bin_clearance: 0.03         # nor is one in a bin or this close to its footprint (bin rims can look like objects)
  time_limit_s: 120.0         # episode length assumed when AALTO_TIME_LIMIT is not set
  time_margin_s: 0.5          # a pick starts only if its release ends this long before the limit
  chunk_ticks: 10             # ticks per reply while a trajectory runs
  hold_ticks: 6               # ticks per reply while the planner works
  settle_s: 0.3               # hold after every motion before the head image is used
  max_attempts: 2             # picks started on one spot before the object is left alone
  same_object_radius: 0.03    # detections this close to an earlier attempt are the same object
  empty_looks_before_done: 2  # looks in a row without a sortable object before `done` is sent
  min_detection_confidence: 0.5
  min_instruction_confidence: 0.5
  release_shifts:             # per bin: pelvis xy shifts of the default release point, used in turn so objects do not stack
    left: [[0.0, 0.0], [0.0, 0.07]]
    center: [[0.0, -0.035], [0.0, 0.035]]
    right: [[0.0, 0.0], [0.0, -0.07]]
  grip_check: true            # calibrate the hands once per episode and give a pick up when the hand is empty after the lift
  grip_settle_s: 0.45         # the hand command must be still this long before its tracking error is read
  grip_threshold:             # summed finger shortfall (rad) under which a hand holds nothing, per hand class
    stiff: 0.02               # the sim hand: an empty hand reads 0.000, a held object 0.04-0.18 with the organiser pinch
    soft: 0.3                 # the real hand: empty 0.07-0.15, holding 0.5-1.4 in the organisers' teleop data
  stiff_hand_lag_s: 0.1       # a hand whose joints trail the command by less than this is the stiff (sim) kind
  calibration_sample_ticks: 5 # ticks between hand samples during the calibration close (short replies cost policy rate)
  transit_clearance: 0.02     # hand points stay this far above the counter and the bin rims on moves to the look pose
  relocate: true              # cross-body fallback: put the object where an arm that reaches the bin can take it
  background_nice: 10         # niceness of the planning thread (Linux)
  gil_switch_s: 0.001         # planning is pure Python: hand the interpreter back to act() this often

poses: {}                     # named arm poses for `policy.look_pose`: 14 joint angles, left arm then right arm

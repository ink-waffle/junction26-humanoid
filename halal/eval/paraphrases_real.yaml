- id: real-prism-and-cube
  split: test
  category: color_shape
  text: "Put the {c0} prism into the {b0} box and the {c1} cube into the {b1} box."
  mapping: {c0/triangle: b0, c1/cube: b1}
  words: {red: orange, blue: purple}
- id: real-cube-into-orange-box
  split: test
  category: color_shape
  text: "Put the {c0} cube in the {b0} orange box."
  mapping: {c0/cube: b0}
  words: {red: orange, blue: purple}
- id: real-cube-then-other-same-colour
  split: test
  category: color_shape
  text: "Put the {c0} cube into the {b0} box and all the other {c0} objects into the {b1} box."
  mapping: {c0/cube: b0, c0: b1}
  words: {red: orange, blue: purple}
- id: real-cube-three-orange-boxes
  split: test
  category: color_shape
  text: "There are three orange boxes on the table. Put the {c0} cube into the {b0} one."
  mapping: {c0/cube: b0}
  words: {red: orange, blue: purple}

# ---------------------------------------------------------------- shape: shape-only instructions, orange boxes around
- id: real-shape-cubes-only
  split: test
  category: shape
  text: "Put the cubes into the {b0} box."
  mapping: {cube: b0}
- id: real-shape-all-three
  split: test
  category: shape
  text: "Put the cubes into the {b0} box, the cylinders into the {b1} box and the triangular prisms into the {b2} box."
  mapping: {cube: b0, cylinder: b1, triangle: b2}
- id: real-shape-into-orange-boxes
  split: test
  category: shape
  text: "Sort by shape into the orange boxes: cubes {b0}, cylinders {b1}, prisms {b2}."
  mapping: {cube: b0, cylinder: b1, triangle: b2}
- id: real-shape-single-prism
  split: test
  category: shape
  text: "Put the triangular prism into the {b0} box."
  mapping: {triangle: b0}
- id: real-shape-whatever-colour
  split: test
  category: shape
  text: "Every cube goes into the {b0} box, whether it is purple, yellow or orange."
  mapping: {cube: b0}

  text: "The colours {c0}, {c1} and {c2} correspond to the {b0}, {b1} and {b2} bin, in this order."
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cr-two-respectively-plus-one
  split: test
  category: color_respectively
  text: "{C0} and {c1} objects go in the {b0} and {b1} bins respectively; {c2} objects go in the {b2} bin."
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cr-starting-from-your-left
  split: test
  category: color_respectively
  text: "Sort by colour. Order of the bins, starting from your left: {c0}, {c1}, {c2}."
  mapping: {c0: left, c1: center, c2: right}
- id: cr-same-order
  split: test
  category: color_respectively
  text: "Colours: {c0}, {c1}, {c2}. Bins: {b0}, {b1}, {b2}. Same order."
  mapping: {c0: b0, c1: b1, c2: b2}

# ---------------------------------------------------------------- color_rest: remainders, shared bins, colours left unmentioned (those stay out of the mapping)
- id: rest-everything-else
  split: test
  category: color_rest
  text: "{C0} objects go in the {b0} bin and {c1} objects in the {b1} bin. Everything else goes in the {b2} bin."
  mapping: {c0: b0, c1: b1, default: b2}
- id: rest-whatever-is-left
  split: test
  category: color_rest
  text: "Put the {c0} ones in the {b0} bin and the {c1} ones in the {b1} bin; whatever is left on the table after that goes in the {b2} bin."
  mapping: {c0: b0, c1: b1, default: b2}
- id: rest-other-two-colours
  split: test
  category: color_rest
  text: "The {c0} objects go into the {b0} bin. The other two colours go into the {b1} bin."
  mapping: {c0: b0, default: b1}
- id: rest-two-together
  split: test
  category: color_rest
  text: "Put the {c0} and {c1} objects together in the {b0} bin, and the {c2} objects in the {b1} bin."
  mapping: {c0: b0, c1: b0, c2: b1}
- id: rest-only-two-colours-matter
  split: test
  category: color_rest
  text: "Today only two colours matter: {c0} objects go to the {b0} bin and {c1} objects go to the {b1} bin."
  mapping: {c0: b0, c1: b1}
- id: rest-just-one-colour
  split: test
  category: color_rest
  text: "Just move the {c0} objects to the {b0} bin, that is all."
  mapping: {c0: b0}
- id: rest-remaining-colour-remaining-bin
  split: test
  category: color_rest
  text: "{C0} goes in the {b0} bin, {c1} goes in the {b1} bin, and the remaining colour goes in the remaining bin."
  mapping: {c0: b0, c1: b1, c2: b2}
- id: rest-except-which
  split: test
  category: color_rest
  text: "Everything goes in the {b0} bin, except the {c0} objects, which go in the {b1} bin."
  mapping: {c0: b1, default: b0}
- id: rest-bin-for-both
  split: test
  category: color_rest
  text: "The {b0} bin is for both {c0} and {c1} objects; the {b1} bin is for {c2} objects."
  mapping: {c0: b0, c1: b0, c2: b1}
- id: rest-all-in-one-bin
  split: test
  category: color_rest
  text: "Put all the objects into the {b0} bin, whatever their colour."
  mapping: {default: b0}
- id: rest-only-for-remaining
  split: test
  category: color_rest
  text: "The {b0} bin is only for {c0} objects. All remaining objects go to the {b1} bin."
  mapping: {c0: b0, default: b1}
- id: rest-and-so-do
  split: test
  category: color_rest
  text: "{C0} objects go to the {b0} bin. {C1} objects go to the {b1} bin, and so do the {c2} ones."
  mapping: {c0: b0, c1: b1, c2: b1}
- id: rest-same-bin-as
  split: test
  category: color_rest
  text: "Put {c0} objects in the {b0} bin and {c1} objects in the {b1} bin. {C2} objects go in the same bin as the {c0} ones."
  mapping: {c0: b0, c1: b1, c2: b0}
- id: rest-two-colours-plain
  split: test
  category: color_rest
  text: "{C0} objects go in the {b0} bin and {c1} objects go in the {b1} bin."
  mapping: {c0: b0, c1: b1}

# ---------------------------------------------------------------- shape: sorting by shape
- id: sh-by-shape-colon
  split: test
  category: shape
  text: "Sort the objects by shape: cubes in the {b0} bin, cylinders in the {b1} bin, triangles in the {b2} bin."
  mapping: {cube: b0, cylinder: b1, triangle: b2}
- id: sh-ignore-colours
  split: test
  category: shape
  text: "This time ignore the colours. All cylinders go in the {b0} bin, all triangles in the {b1} bin and all cubes in the {b2} bin."
  mapping: {cylinder: b0, triangle: b1, cube: b2}
- id: sh-bin-colon-shape
  split: test
  category: shape
  text: "{B0} bin: triangles. {B1} bin: cubes. {B2} bin: cylinders."
  mapping: {triangle: b0, cube: b1, cylinder: b2}
- id: sh-square-round-triangular
  split: test
  category: shape
  text: "Put the square objects in the {b0} bin, the round ones in the {b1} bin and the triangular ones in the {b2} bin."
  mapping: {cube: b0, cylinder: b1, triangle: b2}
- id: sh-triangular-prisms
  split: test
  category: shape
  text: "Cylinders go to the {b0} bin, triangular prisms go to the {b1} bin, and cubes go to the {b2} bin."
  mapping: {cylinder: b0, triangle: b1, cube: b2}
- id: sh-respectively
  split: test
  category: shape
  text: "Cubes, cylinders and triangles go into the {b0}, {b1} and {b2} bins, respectively."
  mapping: {cube: b0, cylinder: b1, triangle: b2}
- id: sh-two-shapes-only
  split: test
  category: shape
  text: "Only cubes and cylinders are sorted in this round: cubes into the {b0} bin, cylinders into the {b1} bin."
  mapping: {cube: b0, cylinder: b1}
- id: sh-cubes-then-rest
  split: test
  category: shape
  text: "All cubes go in the {b0} bin. Everything else goes in the {b1} bin."
  mapping: {cube: b0, default: b1}
- id: sh-two-together
  split: test
  category: shape
  text: "Cubes and cylinders go together in the {b0} bin; the triangles go in the {b1} bin."
  mapping: {cube: b0, cylinder: b0, triangle: b1}
- id: sh-regardless-of-colour
  split: test
  category: shape
  text: "Regardless of colour, every cylinder belongs in the {b0} bin, every cube in the {b1} bin and every triangle in the {b2} bin."
  mapping: {cylinder: b0, cube: b1, triangle: b2}
- id: sh-colours-mentioned
  split: test
  category: shape
  text: "The objects come in red, yellow and blue, but sort them by their shape: triangles to the {b0} bin, cubes to the {b1} bin, cylinders to the {b2} bin."
  mapping: {triangle: b0, cube: b1, cylinder: b2}
- id: sh-missing-articles
  split: test
  category: shape
  text: "Put all cube to {b0} bin, all cylinder to {b1} bin, all triangle to {b2} bin."
  mapping: {cube: b0, cylinder: b1, triangle: b2}
- id: sh-left-to-right
  split: test
  category: shape
  text: "By shape, from left to right: cubes, triangles, cylinders."
  mapping: {cube: left, triangle: center, cylinder: right}
- id: sh-bare-prisms
  split: test
  category: shape
  text: "The {b0} bin is for cylinders, the {b1} bin is for prisms, the {b2} bin is for cubes."
  mapping: {cylinder: b0, triangle: b1, cube: b2}

# ---------------------------------------------------------------- color_shape: colour and shape together; colour/shape beats colour beats shape beats default
- id: cs-two-specific-objects
  split: test
  category: color_shape

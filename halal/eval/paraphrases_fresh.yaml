  mapping: {c0/cube: b0, c1/cylinder: b1}
- id: cs-cubes-other-same-colour-rest
  split: test
  category: color_shape
  text: "{C0} cubes go in the {b0} bin, all other {c0} objects in the {b1} bin, and everything else in the {b2} bin."
  mapping: {c0/cube: b0, c0: b1, default: b2}
- id: cs-colour-with-exception
  split: test
  category: color_shape

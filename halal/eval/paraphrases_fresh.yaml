# Fresh, blind evaluation set for the sort_language instruction parser (Junction 2026, Aaltonomous Humanoid).
#
# Written without sight of paraphrases.yaml and of everything under halal/language/, and never run against the
# parser, so a score on this file measures generalisation. Do NOT tune the parser on individual entries of this
# file: once it has given feedback it is no longer blind. Same entry format as paraphrases.yaml (see
# paraphrases.py); every entry is split: test. To load it, point halal.eval.paraphrases.PATH at this file and
# clear the cache: paraphrases._entries.cache_clear().

# ---------------------------------------------------------------- color_full: all three colours named, canonical positions (left / center / right)
- id: cf-bare-pairs
  split: test
  category: color_full
  text: "{c0} {b0}, {c1} {b1}, {c2} {b2}"
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cf-ascii-arrows
  split: test
  category: color_full
  text: "{c0} -> {b0}, {c1} -> {b1}, {c2} -> {b2}"
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cf-equals-semicolons
  split: test
  category: color_full
  text: "{c0} = {b0} bin; {c1} = {b1} bin; {c2} = {b2} bin"
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cf-bin-colon-colour
  split: test
  category: color_full
  text: "{B0}: {c0}. {B1}: {c1}. {B2}: {c2}."
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cf-rule-anything-belongs
  split: test
  category: color_full
  text: "Sorting rule for this run: anything {c0} belongs in the {b0} bin, anything {c1} in the {b1} bin, anything {c2} in the {b2} bin."
  mapping: {c0: b0, c1: b1, c2: b2}
- id: cf-bin-gets

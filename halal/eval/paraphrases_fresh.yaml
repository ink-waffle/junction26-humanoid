- id: cs-three-specific-kinds
  split: test
  category: color_shape
  text: "{C0} cubes belong in the {b0} bin, {c1} cylinders in the {b1} bin and {c2} triangles in the {b2} bin."
  mapping: {c0/cube: b0, c1/cylinder: b1, c2/triangle: b2}
- id: cs-cubes-then-others-by-colour
  split: test
  category: color_shape
  text: "Cubes go in the {b0} bin. Cylinders and triangles are sorted by colour: {c0} in the {b1} bin, {c1} and {c2} in the {b2} bin."
  mapping: {c0/cube: b0, c1/cube: b0, c2/cube: b0, c0: b1, c1: b2, c2: b2}
- id: cs-non-native-both-to
  split: test
  category: color_shape

# Held-out paraphrase templates for sort_language. Loader, renderer and validator: paraphrases.py.
# text:    {c0} {c1} {c2} colours and {b0} {b1} {b2} bins, in any permutation; {C0} / {B0} are capitalised.
# mapping: key = colour slot | cube | cylinder | triangle | <colour slot>/<shape> | default
#          value = bin slot, or a literal bin when the text fixes it ("from left to right").
#          Resolution per object: colour/shape -> colour -> shape -> default -> no key = leave it on the table.
# words:   optional surface form of a canonical colour or bin, applied to the slots at render time.
# split:   dev failures are shown to the parser author, test is hidden. Near-duplicates share a split.

# ============================================================ color_full / dev

# Aalto-* tasks: like teleimager_isaacsim_zmq.yaml but the head is ONE 640x480 colour cam (RealSense colour,
# calibration.yaml head); its depth goes out separately on :55560 (aalto_task/hooks.py, head_rgbd_server format).
# =====================================================
# TeleImager server configuration for the Isaac Sim / Isaac Lab simulator (unitree_sim_isaaclab)
#
# Used by teleimager.server.run_isaacsim_server() when no config path is given. The cameras read the
# simulator's shared-memory images:
#   head stereo left / right eye : "head" / "head_right"   wrist cameras : "left" / "right"
# Topic names and ports match the real robot, so xr_teleoperate connects to the simulator unchanged.
# =====================================================

webrtc:
  bitrate:
    min: 2000000      # floor under congestion
    default: 5000000  # startup rate, skips slow-start
    max: 12000000     # quality ceiling on healthy network
  gop_length: null    # keyframe interval in FRAMES; null = 2 seconds (2 x camera fps)

camera:
  head_camera:
    enable_zmq: true
    zmq_port: 55555
    enable_webrtc: false
    webrtc_port: 60001
    webrtc_codec: h264
    type: isaacsim
    image_shape: [480, 640]    # mono RealSense colour
    binocular: false
    fps: 30
  left_wrist_camera:
    enable_zmq: true
    zmq_port: 55556
    enable_webrtc: false
    webrtc_port: 60002
    webrtc_codec: h264
    type: isaacsim
    image_shape: [480, 640]
    binocular: false
    fps: 30
  right_wrist_camera:
    enable_zmq: true
    zmq_port: 55557
    enable_webrtc: false
    webrtc_port: 60003
    webrtc_codec: h264
    type: isaacsim
    image_shape: [480, 640]
    binocular: false
    fps: 30

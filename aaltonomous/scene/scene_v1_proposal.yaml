# PROPOSAL v1 (2026-11-05, not adopted): fits the URDF reach + head view, see spec §11 and check_layout.py.
# Counter top at pelvis height, mat 12 cm in front of the pelvis, 10 cm bins at left / front / right.
# Aaltonomous scene geometry -- single source of truth for sim (WP3), real resets (layout cards),
# the success checker / scoring (WP4), the safety workspace box and the printed parts.
# Values marked (default) are placeholders until the physical counter is measured (M3);
# change them HERE only, then re-run `python -m aaltonomous.scene.export` for meshes + mat.
#
# Frames
#   pelvis: robot pelvis link (fixed base in sim). x forward, y left, z up. Metres.
#   mat:    printed counter mat. Origin = mat corner on the robot's RIGHT, at the edge NEAREST the robot.
#           x runs along that edge towards the robot's LEFT, y runs AWAY from the robot, z up (on the mat).
#           Layout cards and the printed grid use mat coordinates (cm).
#   p_pelvis = mat_origin_in_pelvis + (y_mat, x_mat, z_mat)     (pure translation + 90 deg yaw)

version: 1

counter:
  # Mat origin expressed in the pelvis frame. (default) -- measure on the real setup.
  mat_origin_in_pelvis: [0.12, -0.40, 0.00]    # 12 cm in front of pelvis, mat centred, surface at pelvis height
  mat_size: [0.80, 0.45]                      # x (width along robot), y (depth away from robot)
  counter_size: [1.00, 0.60]                  # physical table top, centred on the mat; cubes beyond it = "off"
  grid_cm: 5                                  # printed grid pitch
  mat_texture: mat_texture.png                # generated by export.py; same file in sim and on the print

cube:
  size: 0.050                                 # (default) verify Dex3 grasps it reliably
  colors:                                     # matte PLA; RGB used in sim (0-255)
    red: [200, 30, 30]
    yellow: [235, 200, 20]
    blue: [30, 70, 200]
  copies_per_color: 2

bins:
  outer_size: [0.10, 0.10]                    # smaller than v0 so they fit in reach
  wall_height: 0.06
  wall_thickness: 0.003
  floor_thickness: 0.003
  # Centres in mat coordinates. Bins sit on the FAR band of the mat, cubes on the near band.
  centers:
    left:   [0.70, 0.15]                      # beside the cube region, robot's left                      # robot's left = large mat x
    center: [0.40, 0.05]                      # in FRONT of the cube region, close to the robot (not seen by head cam)
    right:  [0.10, 0.15]
  rgb: [230, 110, 30]                         # all boxes identical (orange); positions name them

layout:
  # Region where cube centres are sampled (mat coordinates, m) and the minimum centre spacing.
  region_x: [0.24, 0.56]                     # kept inside the head camera view (test_scene checks it)
  region_y: [0.14, 0.24]
  min_spacing: 0.08
  n_cubes: [3, 5]                             # 6 cubes do not fit the smaller region at 8 cm spacing
  yaw_range_deg: [-45, 45]

success:
  at_rest_speed: 0.02                         # m/s; cube centre speed below this counts as at rest
  inside_margin: 0.0                          # m; cube centre must be inside the bin's INNER footprint
  off_counter_drop: 0.03                      # m; centre this far below the counter surface = knocked off

scoring:                                      # spec §3
  sort_fixed:    {"correct": 1, "wrong": -1, "counter": 0, "off": -1}
  sort_language: {"correct": 2, "wrong": -1, "counter": 0, "off": -1}
  # Not at rest at episode end counts as "counter" (0 points) unless it is inside a bin by the rule above.
